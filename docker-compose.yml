version: '3.8'

services:
  wake-on-lan-dashboard:
    build: .
    container_name: wake-on-lan-dashboard
    restart: unless-stopped
    # network_mode: host memungkinkan Magic Packet UDP broadcast langsung ke interface jaringan fisik host.
    # Ini diperlukan agar WoL berfungsi dari dalam Docker container.
    # CATATAN: network_mode: host hanya didukung di Linux (tidak berlaku di Docker Desktop Windows/macOS).
    network_mode: host
    environment:
      - NODE_ENV=production
      # Saat network_mode: host, port langsung menggunakan port host (tidak ada port mapping).
      - PORT=8096
      # Atur ke 'false' jika ingin deploy dalam keadaan BERSIH / KOSONG (tanpa data dummy/contoh).
      # Atur ke 'true' jika ingin memuat contoh perangkat dummy pada instalasi pertama kali.
      - LOAD_SAMPLE_DATA=false
    volumes:
      # Persistent storage agar semua perangkat yang Anda tambahkan tidak hilang saat container di-restart/update
      - ./data:/app/data
